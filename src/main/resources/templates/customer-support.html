<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support - Your E-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f8f9fa;
        }

        .navbar {
            background-color: var(--primary-color);
            padding: 1rem;
        }

        .footer {
            background-color: #333;
            color: white;
            padding: 2rem 0;
            margin-top: 3rem;
        }

        .ticket-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }

        .ticket-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .priority-high { color: #e74c3c; }
        .priority-medium { color: #f39c12; }
        .priority-low { color: #27ae60; }

        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Your E-commerce</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/cart">Cart</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/support">Support</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-4">
    <div class="row">
        <!-- Support Ticket Form -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Create Support Ticket</h5>
                </div>
                <div class="card-body">
                    <form id="ticketForm">
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" id="priority">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="customerEmail" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Submit Ticket</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Ticket List -->
        <div class="col-md-8">
            <h3>Your Support Tickets</h3>
            <div id="ticketList" th:each="ticket : ${tickets}" class="ticket-card">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 th:text="${ticket.subject}">Ticket Subject</h5>
                    <span th:class="'status-badge ' + ${ticket.status}"
                          th:text="${ticket.status}">Status</span>
                </div>
                <p th:text="${ticket.description}">Description</p>
                <div class="d-flex justify-content-between align-items-center">
                    <small th:class="'priority-' + ${#strings.toLowerCase(ticket.priority)}"
                           th:text="'Priority: ' + ${ticket.priority}">Priority</small>
                    <div>
                        <button class="btn btn-sm btn-outline-primary edit-ticket">Edit</button>
                        <button class="btn btn-sm btn-outline-danger delete-ticket">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <h5>Contact Us</h5>
                <p>Email: support@yourecommerce.com</p>
                <p>Phone: (555) 123-4567</p>
            </div>
            <div class="col-md-4">
                <h5>Quick Links</h5>
                <ul class="list-unstyled">
                    <li><a href="/" class="text-white">Home</a></li>
                    <li><a href="/products" class="text-white">Products</a></li>
                    <li><a href="/about" class="text-white">About Us</a></li>
                </ul>
            </div>
            <div class="col-md-4">
                <h5>Follow Us</h5>
                <div class="social-links">
                    <a href="#" class="text-white me-2"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="text-white me-2"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="text-white me-2"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const ticket = {
            subject: document.getElementById('subject').value,
            description: document.getElementById('description').value,
            priority: document.getElementById('priority').value,
            customerEmail: document.getElementById('customerEmail').value
        };

        try {
            const response = await fetch('/support/ticket/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(ticket)
            });

            if (response.ok) {
                window.location.reload();
            }
        } catch (error) {
            console.error('Error:', error);
        }
    });

    // Add event listeners for edit and delete buttons
    document.querySelectorAll('.edit-ticket').forEach(button => {
        button.addEventListener('click', function() {
            const ticketCard = this.closest('.ticket-card');
            // Implement edit functionality
        });
    });

    document.querySelectorAll('.delete-ticket').forEach(button => {
        button.addEventListener('click', async function() {
            const ticketCard = this.closest('.ticket-card');
            const ticketId = ticketCard.dataset.ticketId;

            if (confirm('Are you sure you want to delete this ticket?')) {
                try {
                    const response = await fetch(`/support/ticket/${ticketId}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        ticketCard.remove();
                    }
                } catch (error) {
                    console.error('Error:', error);
                }
            }
        });
    });
</script>
</body>
</html>

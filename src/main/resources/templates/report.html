<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECom2 Shop - Sales Report</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #2ecc71;
            --background-color: #f8f9fa;
            --card-background: white;
            --text-color: #2c3e50;
            --border-radius: 12px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hero {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: -3rem;
        }

        .stat-card {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .stat-card i {
            font-size: 2.5rem;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .chart-card {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 1rem;
        }

        .orders-table {
            background: var(--card-background);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-top: 2rem;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .table th, .table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .table th {
            background-color: var(--background-color);
            font-weight: 600;
        }

        .footer {
            background: var(--primary-color);
            color: white;
            padding: 2rem 1rem;
            margin-top: 4rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        @media (max-width: 768px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }

            .stats-cards {
                margin-top: -2rem;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="header-content">
        <div class="logo">
            <i class="fas fa-shopping-bag"></i>
            ECom2 Shop
        </div>
        <nav>
            <i class="fas fa-user"></i>
        </nav>
    </div>
</header>

<section class="hero">
    <h1>Sales Report Dashboard</h1>
    <p>Comprehensive overview of sales performance and analytics</p>
</section>

<div class="container">
    <div class="stats-cards">
        <div class="stat-card">
            <i class="fas fa-dollar-sign"></i>
            <h3>Total Sales</h3>
            <h2 th:text="${'$' + #numbers.formatDecimal(totalSales, 0, 'COMMA', 2, 'POINT')}">$0.00</h2>
        </div>
        <div class="stat-card">
            <i class="fas fa-user-tie"></i>
            <h3>Staff ID</h3>
            <h2 th:text="${staffId}">STAFF-1</h2>
        </div>
        <div class="stat-card">
            <i class="fas fa-shopping-cart"></i>
            <h3>Total Orders</h3>
            <h2 th:text="${#lists.size(orders)}">0</h2>
        </div>
    </div>

    <div class="chart-grid">
        <div class="chart-card">
            <h3><i class="fas fa-chart-line"></i> Monthly Sales Trend</h3>
            <div class="chart-container">
                <canvas id="monthlySalesChart"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h3><i class="fas fa-chart-pie"></i> Product Distribution</h3>
            <div class="chart-container">
                <canvas id="productSalesChart"></canvas>
            </div>
        </div>
    </div>

    <div class="orders-table">
        <h3><i class="fas fa-list"></i> Recent Orders</h3>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.orderId}"></td>
                    <td th:text="${order.date}"></td>
                    <td>
                                <span th:each="item, iterStat : ${order.items}">
                                    <span th:text="${item.quantity + 'x ' + item.productName}"></span>
                                    <span th:if="${!iterStat.last}">, </span>
                                </span>
                    </td>
                    <td th:text="${'$' + #numbers.formatDecimal(order.total, 0, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2024 ECom2 Shop. All rights reserved.</p>
    </div>
</footer>

<script th:inline="javascript">
    // Get the data from Thymeleaf
    const monthlySales = /*[[${monthlySales}]]*/ {};
    const productSales = /*[[${productSales}]]*/ {};

    // Monthly Sales Chart
    new Chart(document.getElementById('monthlySalesChart'), {
        type: 'line',
        data: {
            labels: Object.keys(monthlySales),
            datasets: [{
                label: 'Monthly Sales ($)',
                data: Object.values(monthlySales),
                borderColor: '#3498db',
                backgroundColor: 'rgba(52, 152, 219, 0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)'
                    }
                },
                x: {
                    grid: {
                        display: false
                    }
                }
            }
        }
    });

    // Product Sales Chart
    new Chart(document.getElementById('productSalesChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(productSales),
            datasets: [{
                data: Object.values(productSales),
                backgroundColor: [
                    '#3498db',
                    '#e74c3c',
                    '#2ecc71',
                    '#f1c40f',
                    '#9b59b6'
                ]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>
</body>
</html>
